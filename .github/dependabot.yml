version: 2
updates:
  # The extension itself has no runtime dependencies; this keeps CI actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  # The browser driver for the verification harnesses (not shipped with the extension).
  - package-ecosystem: npm
    directory: /verification
    schedule:
      interval: monthly
    labels: ["dependencies"]
