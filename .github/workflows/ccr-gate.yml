name: ccr gate

# Posts the "CCR gate" commit status on every open pull request: success only when Copilot code
# review has reviewed the current head commit, recommends approval and lists no open issues.
# Required on main, it stops any merge, by a person or an agent, until that clean review exists.
# Unresolved review threads are blocked separately by main's conversation resolution rule.
# See CONTRIBUTING.md.
#
# A new push gets no status until the gate posts one, so a required CCR gate blocks the new head
# from the moment it is pushed. Copilot's own review events start no workflow, so a 15-minute
# schedule picks up new reviews; pull request events also start a check at once. GitHub can delay
# or skip scheduled runs for hours, so after Copilot reviews a head commit, run this workflow by
# hand (gh workflow run ccr-gate.yml) to count the review at once; AGENTS.md tells agents to.
#
# Every run checks every open pull request, one run at a time: pull requests can share a head
# commit, and a status belongs to the commit. A newer pending run replaces an older one, so the
# last status posted always comes from the latest read. When a run changes a status, it starts a
# stack gate sweep, since a stack member's required CCR gate can change without a push.
#
# Both gates share the GITHUB_TOKEN budget of 1,000 API requests an hour for this repository, so
# they read as little as they can and sweep every 15 minutes, not more often.
#
# The required check trusts statuses from github-actions[bot], and any workflow in this repository
# can post as that account, including one a pull request adds or edits. The gate guards against
# merging too early, not against a change to .github/ itself; review those changes by hand.
#
# pull_request_target runs with a write token, so this workflow never checks out or runs pull
# request code. It checks out the default branch for .github/scripts alone and reads the pull
# requests through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ccr-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Check Copilot code review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Post the CCR gate status
        id: gate
        run: node .github/scripts/ccr-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # A workflow_dispatch from GITHUB_TOKEN is the one event it can start. Its own job keeps
  # actions: write away from the job that reads pull requests.
  refresh-stacks:
    name: Re-evaluate stacks
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start a stack gate sweep
        run: gh workflow run stack-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
