name: tests

on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled re-run the checks when the no-release label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: node --test com.github.copilot/extensions/jira-workbench/test/*.test.mjs

  browser:
    name: Browser harnesses
    runs-on: ubuntu-latest
    env:
      WORKBENCH_ROOT: ${{ github.workspace }}/com.github.copilot/extensions/jira-workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The extension has no dependencies; the harnesses need only the browser driver.
      # verification/package-lock.json pins it by integrity hash, and Dependabot tracks it.
      - name: Install the browser driver
        run: npm ci --prefix verification --no-audit --no-fund

      - name: Locate Google Chrome
        run: |
          chrome="$(command -v google-chrome || true)"
          if [ -z "$chrome" ]; then
            echo "::error::Google Chrome is not installed on this runner."
            exit 1
          fi
          "$chrome" --version
          echo "BROWSER_EXECUTABLE=$chrome" >> "$GITHUB_ENV"

      - name: Verify the canvas workflow
        run: node verification/verify-canvas.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens

      - name: Verify MCP reconnection
        run: node verification/verify-reconnect.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens

      - name: Verify scoped loading
        run: node verification/verify-scope.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens

      - name: Verify unchanged polls
        run: node verification/verify-poll.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens

      - name: Verify UI budgets at 1,000 issues
        run: node verification/verify-scale.mjs

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-harness-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 7

  hygiene:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject committed local state
        run: |
          if git ls-files | grep -E '(^|/)artifacts/'; then
            echo "::error::artifacts/ contains private local state and must not be committed."
            exit 1
          fi

      - name: Reject absolute home paths
        run: |
          if git grep -nIE '/(Users|home)/[a-z]' -- . ':!.github/workflows'; then
            echo "::error::An absolute user path was committed."
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: false

  release-manifests:
    name: Release manifests
    needs: dependency-review
    # Keep this required check from being skipped when dependency review fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Depth 2 keeps the base: a pull request checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # plugin.json's version, the marketplace entry's version and its pinned ref must name one release.
      - name: Test the release checks
        run: node --test .github/scripts/*.test.mjs

      - name: Check that the manifests agree
        run: node .github/scripts/check-release.mjs

      # A change to the shipped canvas must raise the version, unless the pull request has the no-release label.
      - name: Check that a shipped change raises the version
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-version-bump.mjs
        env:
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}

      - name: Require dependency review on pull requests
        if: github.event_name == 'pull_request' && needs.dependency-review.result != 'success'
        run: |
          echo "::error::Dependency review did not pass."
          exit 1
