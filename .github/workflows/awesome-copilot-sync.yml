name: awesome-copilot-sync

# Keeps the Awesome Copilot listing (plugins/external.json in github/awesome-copilot) on the latest
# release. Awesome Copilot pins each external plugin by version, tag and commit, so a release here does
# not reach it until a pull request there moves the pin. This workflow opens that pull request from the
# owner's fork, or updates the one already open: a newer release replaces an unmerged older one.
#
# Releases made by the release workflow use GITHUB_TOKEN, which does not trigger `release` events, so
# this runs after that workflow instead. Needs the AWESOME_COPILOT_TOKEN secret: a classic personal
# access token with the public_repo scope from the owner of the fork. Without it, the run is skipped.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to list, for example v2.4.2. Defaults to the latest release.
        required: false

permissions:
  contents: read

concurrency:
  group: awesome-copilot-sync
  cancel-in-progress: false

env:
  UPSTREAM: github/awesome-copilot
  FORK: ${{ github.repository_owner }}/awesome-copilot
  BRANCH: jira-workbench-sync

jobs:
  sync:
    name: Update the Awesome Copilot listing
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.AWESOME_COPILOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::AWESOME_COPILOT_TOKEN is not set; skipping the Awesome Copilot listing update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Resolve the release
        id: release
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          name="$(node -p 'require("./plugin.json").name')"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          echo "Listing $name $tag at $sha."

      - name: Prepare the fork branch
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.AWESOME_COPILOT_TOKEN }}
        run: |
          gh repo sync "$FORK" --source "$UPSTREAM" --branch main
          gh repo clone "$FORK" awesome-copilot -- --quiet --depth 1 --branch main
          cd awesome-copilot
          gh auth setup-git
          git checkout -B "$BRANCH"

      - name: Update the listing
        id: listing
        if: steps.token.outputs.present == 'true'
        working-directory: awesome-copilot
        env:
          NAME: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          node ../.github/scripts/awesome-copilot-listing.mjs plugins/external.json "$NAME" "$GITHUB_REPOSITORY" "$VERSION" "$SHA"

      - name: Regenerate and validate the marketplace
        if: steps.listing.outputs.changed == 'true'
        working-directory: awesome-copilot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run plugin:validate

      - name: Open or update the pull request
        if: steps.listing.outputs.changed == 'true'
        working-directory: awesome-copilot
        env:
          GH_TOKEN: ${{ secrets.AWESOME_COPILOT_TOKEN }}
          NAME: ${{ steps.release.outputs.name }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          login="$(gh api user --jq .login)"
          git config user.name "$login"
          git config user.email "$(gh api user --jq .id)+$login@users.noreply.github.com"
          git add plugins/external.json .github/plugin/marketplace.json
          git commit --quiet -m "Update $NAME external plugin to $VERSION"
          git push --force --quiet origin "$BRANCH"

          title="Update $NAME external plugin to $VERSION"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Pull Request Checklist

          - [x] I have read and followed the [CONTRIBUTING.md](https://github.com/github/awesome-copilot/blob/main/CONTRIBUTING.md) guidelines.
          - [x] I have read and followed the [Guidance for submissions involving paid services](https://github.com/github/awesome-copilot/discussions/968).
          - [ ] My contribution adds a new instruction, prompt, agent, skill, workflow, or canvas extension file in the correct directory.
          - [x] The file follows the required naming convention.
          - [x] The content is clearly structured and follows the example format.
          - [x] I have tested my instructions, prompt, agent, skill, workflow, or canvas extension with GitHub Copilot.
          - [x] I have run \`npm start\` and verified that \`README.md\` is up to date.
          - [x] I am targeting the \`main\` branch for this pull request.

          ---

          ## Description

          Version update for the already approved \`$NAME\` external plugin, following "Updating listed external plugins via PR" in CONTRIBUTING.md.

          The existing entry in \`plugins/external.json\` now pins \`version\` $VERSION, \`source.ref\` $TAG and \`source.sha\` $SHA (the $TAG tag commit). \`.github/plugin/marketplace.json\` was regenerated with \`npm run build\`, and \`npm run plugin:validate\` passed. No other fields change.

          Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG

          ---

          ## Type of Contribution

          - [x] Update to existing instruction, prompt, agent, plugin, skill, workflow, or canvas extension.

          ---

          ## Additional Notes

          Opened by the plugin author's release automation in $GITHUB_REPOSITORY. A newer release updates this pull request in place.

          ---

          By submitting this pull request, I confirm that my contribution abides by the [Code of Conduct](../CODE_OF_CONDUCT.md) and will be licensed under the MIT License.
          EOF

          number="$(gh pr list --repo "$UPSTREAM" --head "$BRANCH" --author "$login" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$UPSTREAM" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated https://github.com/$UPSTREAM/pull/$number."
          else
            gh pr create --repo "$UPSTREAM" --base main --head "$login:$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
