name: stack gate

# Posts the "Stack gate" commit status on every open pull request in a stack. It is success only
# when every open member is ready to merge: not a draft, every check main requires passing, no
# reviewer requesting changes, and no unresolved review thread. GitHub already blocks merging a
# pull request while one below it is not ready, but it lets a lower part of the stack merge on its
# own; required on main, this status stops that. Pull requests outside a stack always get success.
# See CONTRIBUTING.md.
#
# Any change to a member re-evaluates the whole stack, so every member's status stays in step:
# pull request, review and review comment events, and every run of the tests workflow when it
# starts and completes, so a re-run blocks the stack while its checks are pending. The ccr gate
# workflow starts a sweep when it changes a status, since a member's required CCR gate can change
# without a push.
# A 15-minute schedule also sweeps every open pull request from the default branch, because:
# - resolving or reopening a review thread triggers no workflow (pull_request_review_thread is a
#   webhook event, not an Actions trigger);
# - review events load this file from the pull request's merge ref, which a stacked pull request
#   lacks until its base branch contains it.
# Statuses are posted only when they change. Both gates share the GITHUB_TOKEN budget of 1,000 API
# requests an hour for this repository, so they read as little as they can and sweep every 15
# minutes, not more often.
#
# These events run with a write token, so this workflow never checks out or runs pull request
# code. It checks out the default branch for .github/scripts alone and reads the pull requests
# through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [tests]
    types: [in_progress, completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number whose stack to re-evaluate; empty sweeps every open pull request
        required: false
        type: string

permissions: {}

jobs:
  resolve:
    name: Find the stack
    # Review events on a fork's pull request run with a read-only token. Stacks live in one
    # repository, and a pull request outside a stack already got its status from pull_request_target.
    if: >-
      !startsWith(github.event_name, 'pull_request_review')
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      stacks: ${{ steps.resolve.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Posts success on pull requests outside any stack; lists the stacks to evaluate.
      - name: Find the stacks this event touches
        id: resolve
        run: node .github/scripts/stack-gate.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}

  evaluate:
    name: Evaluate stack ${{ matrix.stack }}
    needs: resolve
    if: needs.resolve.outputs.stacks != '' && needs.resolve.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.resolve.outputs.stacks) }}
    # One evaluation per stack at a time. A newer pending run replaces an older one, and reads the
    # stack when it starts, so the last status posted reflects the latest state.
    concurrency:
      group: stack-gate-${{ matrix.stack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Post the Stack gate status to every open member
        run: node .github/scripts/stack-gate.mjs evaluate "$STACK"
        env:
          GH_TOKEN: ${{ github.token }}
          STACK: ${{ matrix.stack }}
